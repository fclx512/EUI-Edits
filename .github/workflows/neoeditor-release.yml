name: EUI-Edits release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'EUI-Edits product version (major.minor.patch[-prerelease])'
        required: true
        default: '0.2.0'
        type: string
  push:
    tags:
      - 'v[0-9]*'
      - 'neoeditor-v*'

concurrency:
  group: euiedits-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Determine independent product version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/*') {
            ($env:GITHUB_REF_NAME -replace '^neoeditor-', '') -replace '^v', ''
          } else { $env:INPUT_VERSION }
          if ($version -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$') {
            throw 'Invalid EUI-Edits product version.'
          }
          "NEOEDITOR_VERSION=$version" >> $env:GITHUB_ENV
      - name: Check release preparation guards
        shell: pwsh
        run: ./tests/tools/test_release_scripts.ps1 -Python (Get-Command python).Source
      - name: Prepare frozen release candidate with bounded builds
        shell: pwsh
        run: |
          ./scripts/prepare-neoeditor-release.ps1 -Version $env:NEOEDITOR_VERSION -Parallel 2 `
            -RunDirectory "$env:GITHUB_WORKSPACE/out/tag-release-prep" `
            -OutputDirectory "$env:GITHUB_WORKSPACE/out/neoeditor-release"
      - name: Retain preparation diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: EUI-Edits-release-evidence-${{ github.run_id }}
          path: |
            out/tag-release-prep/*.json
            out/tag-release-prep/*.log
            out/tag-release-prep/*-evidence/*
            out/tag-release-prep/msbuild-diagnostics/**
            out/release-script-tests-*/**/*.json
            out/release-script-tests-*/**/*.log
          if-no-files-found: warn
      - uses: actions/upload-artifact@v6
        with:
          name: EUI-Edits-${{ env.NEOEDITOR_VERSION }}-windows-x64
          path: out/neoeditor-release/*
          if-no-files-found: error
      - name: Create draft release for an EUI-Edits tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $notes = (Get-Content apps/neo_editor/RELEASE-NOTES.md -Raw -Encoding UTF8).Replace('@NEO_EDITOR_VERSION@', $env:NEOEDITOR_VERSION)
          $notesPath = Join-Path $env:RUNNER_TEMP 'neoeditor-release-notes.md'
          [IO.File]::WriteAllText($notesPath, $notes, [Text.UTF8Encoding]::new($false))
          $releasePages = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --paginate --slurp
          if ($LASTEXITCODE -ne 0) { throw 'Cannot enumerate releases; refusing to assume the tag is unused.' }
          $existing = @($releasePages | ConvertFrom-Json | ForEach-Object { $_ } | Where-Object { $_.tag_name -eq $tag })
          if ($existing.Count -gt 0) {
            if (-not $existing[0].draft) { throw 'Refusing to modify an already published release.' }
            throw 'A draft release already exists. Inspect it before replacing any artifacts.'
          }
          $assets = @(Get-ChildItem out/neoeditor-release -File | ForEach-Object { $_.FullName })
          $releaseArgs = @('release','create',$tag,'--verify-tag','--draft','--title',"EUI-Edits $env:NEOEDITOR_VERSION",'--notes-file',$notesPath)
          if ($env:NEOEDITOR_VERSION.Contains('-')) { $releaseArgs += '--prerelease' }
          & gh @releaseArgs @assets
          if ($LASTEXITCODE -ne 0) { throw 'Failed to create EUI-Edits draft release.' }
